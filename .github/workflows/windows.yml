name: Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/**'
      - 'tailscale-gui.ico'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'tailscale-gui.ico'
      - '.github/workflows/windows.yml'

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: 'windows/requirements*.txt'
      - name: Instalar dependências
        run: python -m pip install -r windows/requirements-build.txt
      - name: Testar, compilar e verificar o executável
        run: python -m windows.build
      - name: Disponibilizar pacote portátil e checksum
        uses: actions/upload-artifact@v4
        with:
          name: TailscaleGUI-Windows-x64
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 30
